<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - SERP Entity 分析</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js：畫圖表用的套件，一樣用 CDN 直接載入 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    h1 { display: flex; justify-content: space-between; align-items: center; font-size: 20px; }
    #logout { font-size: 14px; padding: 6px 12px; cursor: pointer; }
    .chart-box { margin: 40px 0; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    canvas { max-height: 400px; }
    #loading { color: #999; }
  </style>
</head>
<body>
  <h1>
    SERP Entity 分析 Dashboard
    <button id="logout" onclick="logout()">登出</button>
  </h1>

  <div id="loading">載入中...</div>

  <div class="chart-box">
    <h3>每篇文章 Entity 個數</h3>
    <canvas id="entityCountChart"></canvas>
  </div>

  <div class="chart-box">
    <h3>Entity 依類型分群（前15名）</h3>
    <canvas id="typeChart"></canvas>
  </div>

  <script>
    const SUPABASE_URL = "https://gxvkjxrsiccmwvmgbncs.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4dmtqeHJzaWNjbXd2bWdibmNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTcwMDEsImV4cCI6MjEwMjY5MzAwMX0.pyYrPXZ53GeOc4Sn9QPqPC5D5fEPn5k_3lgbtHCCGEM";

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkLoginAndLoad() {
      // 檢查目前有沒有登入中的使用者
      const { data: { session } } = await client.auth.getSession();

      if (!session) {
        // 沒登入，導回登入頁，不讓沒登入的人看到任何資料
        window.location.href = "login.html";
        return;
      }

      loadData();
    }

    async function loadData() {
      // 讀取 entity_analysis 這張表的所有資料
      // 因為 RLS 規則要求 authenticated，這裡的請求會帶著登入 session，才能成功讀到資料
      const { data, error } = await client
        .from("entity_analysis")
        .select("*");

      if (error) {
        document.getElementById("loading").textContent = "讀取資料失敗：" + error.message;
        return;
      }

      document.getElementById("loading").style.display = "none";
      renderEntityCountChart(data);
      renderTypeChart(data);
    }

    function renderEntityCountChart(data) {
      // 每篇文章的 entity_count 都一樣（因為我們寫入時每個 entity 都存了同一個 entity_count）
      // 所以先用 title 去重，取得「每篇文章」對應的 entity_count
      const articleMap = {};
      data.forEach(row => {
        if (!articleMap[row.title]) {
          articleMap[row.title] = { rank: row.rank, count: row.entity_count };
        }
      });

      const articles = Object.entries(articleMap).sort((a, b) => a[1].rank - b[1].rank);
      const labels = articles.map(a => "第" + a[1].rank + "名");
      const counts = articles.map(a => a[1].count);

      new Chart(document.getElementById("entityCountChart"), {
        type: "bar",
        data: {
          labels: labels,
          datasets: [{ label: "Entity 個數", data: counts, backgroundColor: "#4A90D9" }]
        },
        options: { responsive: true }
      });
    }

    function renderTypeChart(data) {
      // 依類型統計「不重複實體種類數」（不是加總出現次數，呼應我們 Step 5 的定義）
      const typeCount = {};
      const seen = new Set(); // 避免同個 (type, name) 因為跨文章重複被算多次

      data.forEach(row => {
        const key = row.entity_type + "||" + row.entity_name;
        if (seen.has(key)) return;
        seen.add(key);
        typeCount[row.entity_type] = (typeCount[row.entity_type] || 0) + 1;
      });

      const sorted = Object.entries(typeCount).sort((a, b) => b[1] - a[1]).slice(0, 15);

      new Chart(document.getElementById("typeChart"), {
        type: "pie",
        data: {
          labels: sorted.map(s => s[0]),
          datasets: [{ data: sorted.map(s => s[1]), backgroundColor: ["#4A90D9","#E8A33D","#5DBB63","#D9534F","#9B59B6","#1ABC9C","#F1C40F","#E67E22"] }]
        },
        options: { responsive: true }
      });
    }

    function logout() {
      client.auth.signOut().then(() => {
        window.location.href = "login.html";
      });
    }

    checkLoginAndLoad();
  </script>
</body>
</html>
